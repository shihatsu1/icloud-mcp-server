name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly instead of gitleaks-action: the action scans
      # <first-commit>^..HEAD, which fails on a root commit (first push). The release
      # tarball is verified against the published checksums before use.
      - name: Install gitleaks (checksum-verified)
        run: |
          v=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${v}"
          curl -sSfL -o gitleaks.tgz "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" checksums.txt \
            | sed "s/ gitleaks_${v}_linux_x64.tar.gz/ gitleaks.tgz/" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git --no-banner --redact -v -c .gitleaks.toml .

  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  swift-spike:
    name: Build permission spike (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile spike with embedded Info.plist
        working-directory: spike
        run: |
          swiftc tcc_spike.swift -o tcc_spike \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker Info.plist
          codesign -s - --force tcc_spike
          codesign -dv tcc_spike
      # Not run here: CI runners have no Calendar access, and running would only prove that.

  container:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/Dockerfile -t icloud-mcp-server:ci .
      - name: Refuses to start without configuration
        run: |
          set +e
          out=$(docker run --rm icloud-mcp-server:ci 2>&1); code=$?
          echo "$out"
          test "$code" -eq 2
          echo "$out" | grep -q "Authentication is not configured"
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id icloud-mcp-server:ci -u)" = "10001"
      - name: No secrets baked into the image
        run: |
          ! docker run --rm --entrypoint sh icloud-mcp-server:ci -c 'env | grep -E "PASSWORD|SECRET|SIGNING_KEY"'
