[project]
name = "icloud-mcp-server"
version = "0.1.0"
description = "Hosted MCP server for iCloud Calendar over CalDAV (single owner, OAuth, read-only by default; preview-then-confirm writes)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=4.1.4,<5",
    "caldav>=3.5,<4",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "pydantic>=2",
    "tzdata",
    "py-key-value-aio[firestore,wrappers-encryption]>=0.4.6,<0.5",
]

[project.scripts]
icloud-mcp-server = "icloud_mcp_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "httpx>=0.27", "radicale>=3.3", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against a real Calendar on the developer's Mac; opt-in, TEST calendar only"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/icloud_mcp_server"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

# Strict where a mistake can corrupt a calendar: the write protocol and the CalDAV write path.
[[tool.mypy.overrides]]
module = ["icloud_mcp_server.core.changes", "icloud_mcp_server.core.writes", "icloud_mcp_server.httplog"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

# Third-party typing is incomplete here (python-caldav exports classes lazily; icalendar properties are wide
# unions), so these codes are off for the adapters only. The domain logic above stays strict.
[[tool.mypy.overrides]]
module = ["icloud_mcp_server.backends.*"]
disable_error_code = ["valid-type", "attr-defined", "union-attr", "arg-type", "operator", "misc", "assignment", "call-overload", "index", "return-value", "no-any-return", "override"]
