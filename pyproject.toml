[project]
name = "icloud-mcp-server"
version = "0.0.0"
description = "MCP server for iCloud Calendar: local EventKit mode and hosted CalDAV mode, read-only by default."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=4.1,<5",
    "caldav>=3.5,<4",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "pydantic>=2",
    "tzdata",
    "py-key-value-aio[firestore,wrappers-encryption]>=0.4.6,<0.5",
]

[project.scripts]
icloud-mcp-server = "icloud_mcp_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "httpx>=0.27", "radicale>=3.9.0", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against a real Calendar on the developer's Mac; opt-in, TEST calendar only"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
